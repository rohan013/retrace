[project]
name = "retrace"
version = "0.1.0"
description = "Personal location history"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "geopy",
    "tzfpy",
    "gpxpy",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "playwright",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
